[project]
name = "flowbook"
version = "0.1.0"
description = ""
authors = [{ name = "me", email = "me@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pytest (>=9.0.2,<10.0.0)", "sqlalchemy (>=2.0.46,<3.0.0)", "psycopg[binary] (>=3.3.2,<4.0.0)", "pandas (>=3.0.0,<4.0.0)", "pyarrow (>=23.0.0,<24.0.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
fastapi = "^0.128.0"
httpx = "^0.28.1"
uvicorn = "^0.40.0"

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-locals",
  "too-many-branches",
  "too-many-statements",
  "fixme",
  "assignment-from-no-return",
]
