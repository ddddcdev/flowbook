[project]
name = "flowbook"
version = "0.1.0"
description = ""
authors = [{ name = "me", email = "me@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pytest (>=9.0.2,<10.0.0)", "sqlalchemy (>=2.0.46,<3.0.0)", "psycopg[binary] (>=3.3.2,<4.0.0)", "pandas (>=3.0.0,<4.0.0)", "pyarrow (>=23.0.0,<24.0.0)", "openpyxl (>=3.1.5,<4.0.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
fastapi = "^0.128.0"
httpx = "^0.28.1"
pre-commit = "^4.0.0"
pytest = "^9.0.2"
ruff = "^0.14.14"
uvicorn = "^0.40.0"

[tool.pytest.ini_options]
markers = [
    "unit: unit tests (no DB, no real files, fast)",
    "integration: integration tests (DB or multi-component)",
    "e2e: end-to-end tests (real files or full pipeline)",
    "smoke: smoke tests (API or engine entry point)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
