[project]
name = "flowbook"
version = "0.1.0a4"
description = "Config-driven data flow framework with pluggable ops and extensions (Excel, Postgres, FastAPI)."
authors = [{ name = "d4c.dev", email = "info@d4c.dev" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
excel = ["pandas>=3.0.0,<4.0.0", "openpyxl>=3.1.5,<4.0.0", "xlrd>=2.0.1"]
postgres = [
    "psycopg[binary]>=3.3.2,<4.0.0",
    "sqlalchemy>=2.0.46,<3.0.0",
    "pandas>=3.0.0,<4.0.0",
    "pyarrow>=23.0.0,<24.0.0",
]
fastapi = ["fastapi>=0.128.0", "uvicorn>=0.40.0", "python-multipart>=0.0.22"]
full = [
    "pandas>=3.0.0,<4.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "psycopg[binary]>=3.3.2,<4.0.0",
    "sqlalchemy>=2.0.46,<3.0.0",
    "pyarrow>=23.0.0,<24.0.0",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.22",
]
# Demo: bundled configs for hands-on. Install flowbook[full] then optionally flowbook[demo].
# No extra deps; adds package data for flowbook db reset --config-dir bundled
demo = []

# Dev CLI (Typer/Rich). Install with: pip install "flowbook[dev]"
dev = ["typer>=0.12.0", "rich>=13.0.0", "httpx>=0.28.0", "openpyxl>=3.1.5,<4.0.0"]

[project.scripts]
flowbook = "flowbook.cli:main"

[project.entry-points."flowbook.steps"]
flowbook = "flowbook.core.registry.extensions:register_steps"

[project.entry-points."flowbook.cli"]
flowbook = "flowbook.extensions.cli.cli:register_cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
# full extras (for running tests in repo)
pandas = ">=3.0.0,<4.0.0"
openpyxl = ">=3.1.5,<4.0.0"
psycopg = { extras = ["binary"], version = ">=3.3.2,<4.0.0" }
sqlalchemy = ">=2.0.46,<3.0.0"
pyarrow = ">=23.0.0,<24.0.0"
fastapi = "^0.128.0"
uvicorn = "^0.40.0"
# CLI (flowbook db, hands-on, etc.)
typer = ">=0.12.0"
rich = ">=13.0.0"
# test/lint
httpx = "^0.28.1"
pre-commit = "^4.0.0"
pytest = "^9.0.2"
ruff = "^0.14.14"
python-multipart = "^0.0.22"
psycopg2-binary = "^2.9.11"
twine = "^6.2.0"

[tool.pytest.ini_options]
markers = [
    "unit: unit tests (no DB, no real files, fast)",
    "integration: integration tests (DB or multi-component)",
    "e2e: end-to-end tests (real files or full plan)",
    "smoke: smoke tests (API or engine entry point)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
